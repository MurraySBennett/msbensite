name: Deploy to S3

# Triggers on every push to the main branch.
# To deploy: commit your changes and push to main (or merge a PR into main).
# Can also be run by hand from the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys run at once. Both sync steps use --delete, so
# overlapping runs can delete objects the other run just uploaded.
# Queue the second run instead of cancelling, so a sync is never cut off
# part-way through and left in a half-deployed state.
concurrency:
  group: deploy-s3
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync to S3 and invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials from GitHub Secrets.
      #    You must add these three secrets in your GitHub repo:
      #    Settings → Secrets and variables → Actions → New repository secret
      #    - AWS_ACCESS_KEY_ID
      #    - AWS_SECRET_ACCESS_KEY
      #    - AWS_REGION (e.g. us-east-2)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Sync the repository to S3 in two passes, split by cache lifetime:
      #        HTML files: no-cache (always revalidated by the browser)
      #        Everything else: 1 hour, then revalidate
      #
      #    Assets are referenced by unhashed paths (/css/style.css), so they
      #    deliberately are NOT "immutable". A long TTL would leave returning
      #    visitors on stale CSS/JS after a deploy, and a CloudFront
      #    invalidation cannot clear a browser cache. If you ever wire
      #    version_assets.py into this workflow so filenames carry a content
      #    hash, this can safely become max-age=31536000, immutable.
      #
      #    Filter rules are evaluated in order and the LAST match wins, so
      #    each pass must end with the excludes that need to stick. The HTML
      #    pass starts from --exclude "*" so it really does only carry HTML;
      #    a trailing --include on its own does not narrow anything, because
      #    the filter list starts out including every file.
      #
      #    --delete removes objects from S3 that no longer exist locally. It
      #    only ever considers objects that pass the SAME filters, so the
      #    HTML pass can only delete HTML and the asset pass can only delete
      #    non-HTML. Keep it that way: a pass whose filters are narrower than
      #    the files it is responsible for will delete the rest of the site.
      - name: Sync HTML files to S3 (no-cache)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "*.html" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "node_modules/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Sync static assets to S3 (1 hour cache)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude ".gitignore" \
            --exclude "node_modules/*" \
            --exclude "*.py" \
            --exclude "*.md" \
            --exclude "*.html" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --delete

      # 4. Invalidate the CloudFront distribution so visitors see the new version
      #    immediately. Add this secret too:
      #    - CLOUDFRONT_DISTRIBUTION_ID
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
